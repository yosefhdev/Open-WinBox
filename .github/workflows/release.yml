# Compila el instalador desde el código del repo. Firma con SignPath solo si la variable
# SIGNPATH_ORGANIZATION_ID existe; sin ella deja el instalador sin firmar como artefacto.
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read

env:
  SIGNPATH_PROJECT: OpenWinBox
  SIGNPATH_POLICY: release-signing

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app
        run: ./tools/publish.ps1 -Stage App

      - name: Upload unsigned app
        id: unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: |
            dist/app/OpenWinBox.exe
            dist/app/OpenWinBox.dll
            dist/uninstaller/*

      - name: Sign app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Build installer
        run: ./tools/publish.ps1 -Stage Installer

      - name: Upload unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/OpenWinBox-*-Setup.exe

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Write checksums
        run: ./tools/publish.ps1 -Stage Sums

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/OpenWinBox-*-Setup.exe
            dist/SHA256SUMS.txt
